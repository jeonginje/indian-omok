<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>좌표평면 두더지 게임</title>
  <style>
    body {
      background-color: #f4e2b5;
      text-align: center;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    h1 {
      font-size: 28px;
      margin: 10px 0;
    }
    .game-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      padding: 20px;
    }
    .sidebar {
      width: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff;
      padding: 10px;
      border: 2px solid #333;
    }
    .sidebar img {
      width: 50px;
      height: 50px;
      margin: 5px 0;
    }
    canvas {
      background-color: #f4e2b5;
      border: 2px solid #333;
    }
    .info {
      font-size: 18px;
      margin: 10px;
      display: inline-block;
    }
    input {
      padding: 5px;
      margin: 5px;
    }
    button {
      padding: 7px 12px;
      font-size: 14px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #eee;
    }
    .input-area {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <button onclick="toggleFullScreen()">전체화면</button>
    <h1>좌표평면 두더지 게임</h1>
    <button onclick="startGame()">게임 시작</button>
  </div>

  <div class="input-area">
    <div class="info">좌표를 입력하세요 (예: (2,3))</div>
    <input type="text" id="coordInput" placeholder="(x,y)">
    <button onclick="submitGuess()">입력</button>
  </div>

  <div class="info" id="message"></div>
  <div class="info" id="scoreInfo"></div>

  <div class="game-container">
    <div id="sidebar" class="sidebar">
      <!-- 잡은 두더지 이미지가 여기에 추가됩니다 -->
    </div>
    <canvas id="board" width="600" height="600"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const size = 600;
    const gridCount = 20;
    const cellSize = size / gridCount;
    let mole = null;
    let score = 0;
    let attempts = 0;
    let moleTimer;
    let moleCount = 0;
    const maxMoles = 10;

    const sidebar = document.getElementById("sidebar");

    const moleImage = new Image();
    moleImage.src = "https://i.imgur.com/c32NMVV.png";

    moleImage.onload = () => drawBoard();
    moleImage.onerror = () => console.error("두더지 이미지 로드 실패");

    function drawBoard() {
      ctx.clearRect(0, 0, size, size);
      ctx.strokeStyle = "#333";

      for (let i = 0; i <= gridCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cellSize, 0);
        ctx.lineTo(i * cellSize, size);
        ctx.moveTo(0, i * cellSize);
        ctx.lineTo(size, i * cellSize);
        ctx.stroke();
      }

      ctx.font = "14px sans-serif";
      ctx.fillStyle = "black";
      for (let i = 1; i < 20; i++) {
        const label = 10 - i;
        ctx.fillText(label, size / 2 - 25, i * cellSize + 5);
        ctx.fillText(-10 + i, i * cellSize - 7, size / 2 + 20);
      }

      ctx.beginPath();
      ctx.moveTo(size/2, 0);
      ctx.lineTo(size/2 - 5, 10);
      ctx.lineTo(size/2 + 5, 10);
      ctx.closePath();
      ctx.fillStyle = '#333';
      ctx.fill();
      ctx.fillText("y", size/2 + 10, 15);

      ctx.beginPath();
      ctx.moveTo(size, size/2);
      ctx.lineTo(size - 10, size/2 - 5);
      ctx.lineTo(size - 10, size/2 + 5);
      ctx.closePath();
      ctx.fill();
      ctx.fillText("x", size - 20, size/2 - 10);

      if (mole && moleImage.complete) {
        const drawX = (mole.x + 10) * cellSize - cellSize / 2;
        const drawY = (10 - mole.y) * cellSize - cellSize / 2;
        ctx.drawImage(moleImage, drawX, drawY, cellSize, cellSize);
      }
    }

    function startGame() {
      score = 0;
      attempts = 0;
      moleCount = 0;
      sidebar.innerHTML = '';
      document.getElementById("scoreInfo").textContent = "";
      document.getElementById("message").textContent = "";
      nextMole();
    }

    function nextMole() {
      if (attempts >= 10) {
        document.getElementById("scoreInfo").textContent = `게임 종료! 점수: ${score * 10}점`;
        mole = null;
        drawBoard();
        return;
      }
      document.getElementById("message").textContent = "";
      const x = Math.floor(Math.random() * 19) - 9;
      const y = Math.floor(Math.random() * 19) - 9;
      mole = {x, y};
      drawBoard();
      clearTimeout(moleTimer);
      moleTimer = setTimeout(() => {
        mole = null;
        attempts++;
        drawBoard();
        nextMole();
      }, 6000);
    }

    function submitGuess() {
      const coordText = document.getElementById("coordInput").value.trim();
      const match = coordText.match(/^\(\s*(-?\d+)\s*,\s*(-?\d+)\s*\)$/);
      if (!match) {
        document.getElementById("message").textContent = "(x,y) 형식으로 좌표를 입력하세요.";
        return;
      }
      const xVal = parseInt(match[1]);
      const yVal = parseInt(match[2]);

      if (mole && mole.x === xVal && mole.y === yVal) {
        score++;
        if (moleCount < maxMoles) {
          moleCount++;
          const img = new Image();
          img.src = moleImage.src;
          sidebar.appendChild(img);
        }
        document.getElementById("message").textContent = "정답입니다!";
      } else {
        document.getElementById("message").textContent = "틀렸습니다.";
      }
      document.getElementById("coordInput").value = "";
    }

    document.getElementById("coordInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") submitGuess();
    });

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
